services:
    database:
        image: postgres:alpine
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: mydatabase
        ports:
            - "5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
            - ./db/db.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - backend-network
        restart: always

volumes:
    db-data:


networks:
    backend-network:
        driver: bridge
