<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-light: #f8fafc;
      --text-gray: #94a3b8;
      --success: #10b981;
      --pending: #f59e0b;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    header {
      margin-bottom: 3rem;
      text-align: center;
      animation: fadeInDown 0.8s ease-out;
    }

    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 2rem;
      animation: fadeInUp 0.8s ease-out;
    }

    .card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--text-light);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    input,
    textarea {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
      color: white;
      font-size: 1rem;
      transition: all 0.3s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button:hover {
      background-color: var(--primary-hover);
      transform: scale(1.02);
    }

    .product-list {
      display: grid;
      gap: 1rem;
    }

    .product-card {
      background: rgba(30, 41, 59, 0.7);
      padding: 1.5rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.5s ease-out;
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
    }

    .status-pending {
      color: var(--pending);
      background: rgba(245, 158, 11, 0.15);
    }

    .product-name {
      font-weight: 600;
      font-size: 1.2rem;
    }

    .product-desc {
      color: var(--text-gray);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Task Master</h1>
    <p>Organize your life efficiently</p>
  </header>

  <div class="container">
    <section class="card">
      <h2>✨ Add New Task</h2>
      <form id="taskForm">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" placeholder="e.g. Complete Site Reliability TP" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="description" rows="3" placeholder="Details about this task..."></textarea>
        </div>
        <button type="submit">Add Task</button>
      </form>
    </section>

    <section class="card" style="background: transparent; box-shadow: none; border: none; padding: 0;">
      <div id="taskList" class="product-list">
        <div style="text-align:center; color: var(--text-gray); padding: 2rem;">Loading tasks...</div>
      </div>
    </section>
  </div>

  <script>
    const API_URL = 'http://localhost:8000';
    const form = document.getElementById('taskForm');
    const list = document.getElementById('taskList');

    async function fetchTasks() {
      try {
        const res = await fetch(`${API_URL}/tasks`);
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) {
        console.error(err);
        list.innerHTML = '<div style="color:var(--danger)">Error connecting to backend. Is it running?</div>';
      }
    }

    function renderTasks(tasks) {
      if (!tasks || tasks.length === 0) {
        list.innerHTML = '<div style="text-align:center; color: var(--text-gray);">No tasks found. Start adding some! 🚀</div>';
        return;
      }

      list.innerHTML = tasks.map(t => `
            <div class="product-card">
                <div class="product-header">
                    <span class="product-name">${t.title}</span>
                    <span class="status-badge status-pending">${t.status || 'pending'}</span>
                </div>
                <p class="product-desc">${t.description}</p>
            </div>
        `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;

      try {
        await fetch(`${API_URL}/tasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description })
        });
        form.reset();
        fetchTasks();
      } catch (err) {
        alert('Failed to add task');
      }
    });

    // Initial fetch
    fetchTasks();
  </script>
</body>

</html>
